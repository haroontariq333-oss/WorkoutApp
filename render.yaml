# Render Blueprint: creates the Overload web service with a persistent disk for the database.
# In Render: New > Blueprint, pick this repository, then fill in the values it asks for (see README).
services:
  - type: web
    name: overload
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: overload-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: VAPID_SUBJECT
        sync: false
      # Only these emails can create accounts. For a personal server, enter just your own.
      - key: SIGNUP_EMAILS
        sync: false
      # Optional, for a public launch later: EMAIL_FROM plus BREVO_API_KEY or RESEND_API_KEY
      # turn on email confirmation and password reset. Add them in Render's Environment tab.
