# Render Blueprint: creates the Overload web service with a persistent disk for the database.
# In Render: New > Blueprint, pick this repository, then fill in the values it asks for (see README).
services:
  - type: web
    name: overload
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: overload-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: VAPID_SUBJECT
        sync: false
      # Account emails (verification and password reset): set EMAIL_FROM plus one provider key.
      - key: EMAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Shown in the privacy policy.
      - key: OPERATOR_NAME
        sync: false
      - key: PRIVACY_CONTACT
        sync: false
